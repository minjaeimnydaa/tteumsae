appId: com.tteumsae.app
name: Gate 2 one-stop golden journey
tags:
  - gate2
---
- launchApp
- runFlow:
    label: Close the daily guide when it is visible
    when:
      visible: "강원도로 가는 길, 어디 들를까?"
    commands:
      - tapOn: "확인"
- runFlow:
    label: Leave place detail when it is open
    when:
      visible: "카카오맵에서 경유지로 안내"
    commands:
      - back
- runFlow:
    label: Leave recommendation results when they are open
    when:
      visible: "들를 곳을 골라보세요"
    commands:
      - back
- runFlow:
    label: Reset an existing route input from home
    when:
      visible: "어디로, 몇 시까지 가나요?"
    commands:
      - back
- runFlow:
    label: Open route input from home when needed
    when:
      visible: "목적지 검색"
    commands:
      - tapOn: "목적지 검색"
- hideKeyboard
- assertVisible: "어디로, 몇 시까지 가나요?"
- tapOn: "목적지 장소 검색"
- inputText: "강릉역"
- hideKeyboard
- extendedWaitUntil:
    visible: "강릉역"
    timeout: 15000
- takeScreenshot:
    path: destination-search
    label: Capture destination search results
- tapOn:
    text: "^강릉역$"
    index: 1
- assertVisible: "강릉역"
- assertVisible: "(오늘|내일) [0-9]{2}:[0-9]{2}까지"
- takeScreenshot:
    path: deadline-wheel
    label: Capture the inline arrival deadline wheel
# The default is one hour ahead. Each deliberate upward wheel swipe advances
# about two hours on the test device, giving the long-distance route enough room.
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- scrollUntilVisible:
    element: "틈새 찾기"
    direction: DOWN
- tapOn: "틈새 찾기"
- extendedWaitUntil:
    visible: "들를 곳을 골라보세요"
    timeout: 60000
- assertVisible: "[0-9]{2}:[0-9]{2} 현재 교통 · [0-9]+곳"
- assertVisible: "목적지로 바로 안내"
- takeScreenshot:
    path: recommendations
    label: Capture recommendation results before selection
- tapOn:
    text: "^선택$"
    index: 0
- assertVisible: "선택됨"
- assertVisible: "이 경유지를 선택하면"
- assertVisible: "머물 수 있는 시간"
- assertVisible: "출발 권장"
- assertVisible: "전체 경로"
- swipe:
    start: "50%,71%"
    end: "50%,32%"
    duration: 700
- extendedWaitUntil:
    visible: ".*에 출발 알림"
    timeout: 5000
- assertVisible: "이곳 들러 카카오맵 안내"
- takeScreenshot:
    path: selected-recommendation
    label: Capture a selected one-stop recommendation
