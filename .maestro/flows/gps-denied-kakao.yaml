appId: com.tteumsae.app
name: GPS denied fallback and Kakao Map handoff
tags:
  - gate2
  - device
---
- launchApp:
    permissions:
      all: allow
      location: unset
- runFlow:
    label: Close the daily guide when it is visible
    when:
      visible: "강원도로 가는 길, 어디 들를까?"
    commands:
      - tapOn: "확인"
- runFlow:
    label: Leave place detail when it is open
    when:
      visible: "카카오맵에서 경유지로 안내"
    commands:
      - back
- runFlow:
    label: Leave recommendation results when they are open
    when:
      visible: "들를 곳을 골라보세요"
    commands:
      - back
- runFlow:
    label: Reset an existing route input from home
    when:
      visible: "어디로, 몇 시까지 가나요?"
    commands:
      - back
- assertVisible: "내 위치로 이동"
- tapOn: "내 위치로 이동"
- extendedWaitUntil:
    visible: ".*위치 정보에 액세스.*"
    timeout: 10000
- tapOn: "허용 안함"
- runFlow:
    label: Close the settings guide when Android no longer shows the system prompt
    when:
      visible: "위치 권한을 켜 주세요"
    commands:
      - assertVisible: "앱 설정에서 위치 권한을 허용하거나 위치를 직접 검색해 주세요."
      - tapOn: "취소"
- runFlow:
    label: Open route input after location permission denial
    when:
      visible: "목적지 검색"
    commands:
      - tapOn: "목적지 검색"
- runFlow:
    label: Deny the location screen retry as well
    when:
      visible: ".*위치 정보에 액세스.*"
    commands:
      - tapOn: "허용 안함"
- runFlow:
    label: Close the settings guide after the retry is denied
    when:
      visible: "위치 권한을 켜 주세요"
    commands:
      - assertVisible: "앱 설정에서 위치 권한을 허용하거나 출발지를 직접 검색해 주세요."
      - tapOn: "직접 검색"
- extendedWaitUntil:
    visible: "어디로, 몇 시까지 가나요?"
    timeout: 10000
- tapOn: "출발지 장소 검색"
- eraseText: 50
- inputText: "강릉시청"
- hideKeyboard
- extendedWaitUntil:
    visible: "강릉시청"
    timeout: 15000
- tapOn:
    text: "^강릉시청$"
    index: 1
- tapOn: "목적지 장소 검색"
- eraseText: 50
- inputText: "강릉역"
- hideKeyboard
- extendedWaitUntil:
    visible: "강릉역"
    timeout: 15000
- tapOn:
    text: "^강릉역$"
    index: 1
- assertVisible: "(오늘|내일) [0-9]{2}:[0-9]{2}까지"
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- swipe:
    start: "34%,55%"
    end: "34%,42%"
    duration: 700
- scrollUntilVisible:
    element: "틈새 찾기"
    direction: DOWN
- tapOn: "틈새 찾기"
- extendedWaitUntil:
    visible: "들를 곳을 골라보세요"
    timeout: 60000
- tapOn:
    text: "^선택$"
    index: 0
- assertVisible: "선택됨"
- swipe:
    start: "50%,71%"
    end: "50%,32%"
    duration: 700
- extendedWaitUntil:
    visible: ".*에 출발 알림"
    timeout: 5000
- assertVisible: "이곳 들러 카카오맵 안내"
- tapOn: "이곳 들러 카카오맵 안내"
- waitForAnimationToEnd
- setPermissions:
    appId: com.tteumsae.app
    permissions:
      location: allow
