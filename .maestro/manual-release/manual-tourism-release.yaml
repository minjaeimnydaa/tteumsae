# Run explicitly after preparing the documented release-QA state; not a general smoke flow.
appId: com.tteumsae.app
name: Manual release - real tourist attraction route
---
- launchApp
- runFlow:
    when:
      visible: '어디로, 몇 시까지 가나요\?'
    commands:
      - tapOn: "뒤로"
- runFlow:
    when:
      visible: '강원도로 가는 길, 어디 들를까\?'
    commands:
      - tapOn: "확인"
- tapOn: "목적지 검색"
- extendedWaitUntil:
    visible: '어디로, 몇 시까지 가나요\?'
    timeout: 10000
- runFlow:
    when:
      visible: "출발지 지우기"
    commands:
      - tapOn: "출발지 지우기"
- tapOn: "출발지 장소 검색"
- inputText: "안목해변"
- hideKeyboard
- extendedWaitUntil:
    visible: "^안목해변$"
    timeout: 20000
- tapOn:
    text: "^안목해변$"
    index: 1
- runFlow:
    when:
      visible: "목적지 지우기"
    commands:
      - tapOn: "목적지 지우기"
- tapOn: "목적지 장소 검색"
- inputText: "경포대"
- hideKeyboard
- extendedWaitUntil:
    visible: "^경포대$"
    timeout: 20000
- tapOn:
    text: "^경포대$"
    index: 1
- tapOn: "관광지"
- takeScreenshot: tourist-01-input-before-time
